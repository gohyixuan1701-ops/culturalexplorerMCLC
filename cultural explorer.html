<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cultural Explorer</title>
<style>
  /* ---------- Design tokens ----------
     One theme (dark, to sit on the 3D scene), one accent (brass gold, taken from the scene's brass fittings).
     Corner rule: controls are full pills or circles, panels and cards are 16-20px, small inner items are 10px.
     Layers: scene 0, HUD 3, open book 4, details panel 5, pop-up boxes 6. */
  :root{
    --gold:#d8b36a; --gold-strong:#e9c987; --ink:#f5eedf; --muted:#b9ac92; --on-gold:#1c140c;
    --glass:rgba(20,15,10,.62); --glass-strong:rgba(17,12,8,.9); --panel:rgba(17,12,8,.9);
    --line:rgba(232,205,140,.22); --line-strong:rgba(232,205,140,.5); --hover:rgba(216,179,106,.16);
    --shadow:0 12px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    --ui:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    --display:"Palatino Linotype","Book Antiqua",Palatino,"KaiTi","STKaiti","Kaiti SC",Georgia,serif;   /* heritage serif + brush-style Chinese */
    --ease:cubic-bezier(.16,1,.3,1);
    --chip-leg:#a5583b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0d0b09;color:var(--ink);font-family:var(--ui);
    overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit}
  button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-strong);outline-offset:2px}
  ::-webkit-scrollbar{width:10px} ::-webkit-scrollbar-thumb{background:rgba(232,205,140,.25);border-radius:999px;border:3px solid transparent;background-clip:padding-box}
  kbd{font:600 11px/1 var(--ui);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:rgba(255,255,255,.04)}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}   /* fill the window on high-DPI screens too */

  /* ---------- Brand, top left ---------- */
  .hud-title{position:fixed;top:16px;left:18px;height:46px;display:flex;align-items:center;gap:11px;pointer-events:none;
    padding:0 18px 0 4px;border-radius:14px;border:1px solid var(--line);background:var(--glass);box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%)}
  .seal-mark{flex:none;width:36px;height:36px;border-radius:10px;background:#a3271c;color:#fbe9c8;display:grid;place-items:center;
    font:24px/1 "KaiTi","STKaiti","Kaiti SC",serif;box-shadow:inset 0 0 0 2px rgba(251,233,200,.35)}
  .hud-title b{display:block;font:600 16px/1.15 var(--display);letter-spacing:.03em;color:var(--ink)}
  .hud-title small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}

  /* ---------- Search, top middle ---------- */
  #search{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(380px, calc(100vw - 32px));z-index:3}
  #q{width:100%;height:44px;padding:0 48px 0 20px;border-radius:999px;border:1px solid var(--line);background:var(--glass);
    -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);color:var(--ink);font:15px var(--ui);
    outline:none;box-shadow:var(--shadow);-webkit-user-select:text;user-select:text;transition:border-color .2s,background-color .2s}
  #q::placeholder{color:rgba(245,238,223,.62)}
  #q:focus{border-color:var(--gold);background:rgba(20,15,10,.8)}
  #search kbd{position:absolute;right:14px;top:11px;pointer-events:none}
  #q:focus + kbd{opacity:0}
  #results{list-style:none;margin:8px 0 0;padding:6px;border-radius:16px;border:1px solid var(--line);background:var(--glass-strong);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow);max-height:min(52vh,360px);overflow-y:auto;display:none}
  #results.show{display:block}
  #results li{display:flex;gap:10px;align-items:baseline;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:14.5px;line-height:1.35}
  #results li.on,#results li:hover{background:var(--hover)}
  #results li i{flex:none;width:8px;height:8px;border-radius:50%;transform:translateY(-1px)}
  #results li small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
  #results li.none{cursor:default;color:var(--muted);background:none}

  /* ---------- Tools, top right ---------- */
  #tools{position:fixed;top:16px;right:18px;z-index:3;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;
    border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
    box-shadow:var(--shadow)}
  .tool{height:36px;padding:0 15px;border-radius:999px;border:0;background:none;font-size:14px;cursor:pointer;white-space:nowrap;
    transition:background-color .16s,color .16s,transform .16s var(--ease)}
  /* all four buttons look the same on the glass bar; gold only shows under the cursor (or the finger) */
  #tools .tool:active{transform:scale(.96);background:var(--gold);color:var(--on-gold)}
  @media (hover:hover){ #tools .tool:hover{background:var(--gold);color:var(--on-gold)} }
  #helpBtn{width:36px;padding:0;font-weight:600;color:var(--muted)}

  /* ---------- Minimap, bottom left ---------- */
  #map{--mh:170px;position:fixed;left:18px;bottom:18px;height:var(--mh);width:calc(var(--mh) * 96 / 170);
    border:1px solid var(--line);background:rgba(14,10,7,.6);border-radius:16px;cursor:pointer;z-index:3;box-shadow:var(--shadow);
    touch-action:none;transition:height .25s var(--ease),width .25s var(--ease),background .25s}
  #map.big{--mh:min(440px, calc(100vh - 110px));background:rgba(14,10,7,.85)}   /* expands under the cursor */
  #mapTip{position:fixed;z-index:3;pointer-events:none;background:var(--glass-strong);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;font-size:14px;color:var(--ink);white-space:nowrap;opacity:0;transition:opacity .12s;box-shadow:var(--shadow)}
  #mapTip.show{opacity:1}
  #mapTip small{display:block;font-size:12px;color:var(--muted);margin-top:2px}

  /* ---------- Walk buttons, bottom right ---------- */
  .controls{position:fixed;right:18px;bottom:18px;display:grid;grid-template-columns:repeat(3,auto);gap:8px}
  .controls #fwd{grid-column:2;grid-row:1} .controls #left{grid-column:1;grid-row:2}
  .controls #back{grid-column:2;grid-row:2} .controls #right{grid-column:3;grid-row:2}
  .arrow{width:58px;height:58px;border-radius:50%;border:1px solid var(--line-strong);background:rgba(17,12,8,.72);color:var(--gold);
    cursor:pointer;display:grid;place-items:center;touch-action:none;box-shadow:var(--shadow);transition:background-color .12s,transform .12s var(--ease)}
  .arrow:active,.arrow.held{background:var(--gold);color:var(--on-gold);transform:scale(.95)}
  /* chevrons drawn with borders */
  .chev{display:block;width:11px;height:11px;border:solid currentColor;border-width:2.5px 2.5px 0 0;pointer-events:none}
  .chev.up{transform:translateY(3px) rotate(-45deg)} .chev.down{transform:translateY(-3px) rotate(135deg)}
  .chev.left{transform:translateX(3px) rotate(-135deg)} .chev.right{transform:translateX(-3px) rotate(45deg)}

  /* ---------- "View this book" button and messages ---------- */
  #viewBtn{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);height:48px;padding:0 22px;border-radius:999px;border:0;
    background:var(--gold);color:var(--on-gold);font:600 15px var(--ui);cursor:pointer;opacity:0;pointer-events:none;
    box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .2s,background-color .16s;max-width:calc(100vw - 420px);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #viewBtn.show{opacity:1;pointer-events:auto} #viewBtn:hover{background:var(--gold-strong)}
  #viewBtn::after{content:"Enter";margin-left:12px;font:600 11px/1 var(--ui);padding:4px 7px;border-radius:6px;
    border:1px solid rgba(28,20,12,.35);vertical-align:1px}
  #toast{position:fixed;top:74px;left:50%;transform:translateX(-50%);background:var(--glass-strong);border:1px solid var(--line);
    padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;
    box-shadow:var(--shadow);max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1}

  /* ---------- Details panel ---------- */
  #panel{position:fixed;top:0;right:0;height:100%;width:min(440px,100vw);background:var(--panel);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-left:1px solid var(--line);transform:translateX(100%);
    transition:transform .35s var(--ease);overflow-y:auto;padding:34px 28px 40px;z-index:5;box-shadow:-20px 0 60px rgba(0,0,0,.4)}
  #panel.open{transform:none}
  #closeBtn,.x,#authorClose{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:none;
    color:var(--muted);font-size:24px;line-height:1;cursor:pointer;transition:background-color .16s}
  #closeBtn:hover,.x:hover,#authorClose:hover{background:var(--hover);color:var(--ink)}
  .chip{display:inline-block;font-size:12px;letter-spacing:.04em;padding:5px 11px;border-radius:999px;color:#fff}
  #panel h2{margin:14px 0 6px;font:600 30px/1.25 var(--display);color:var(--ink)}
  #panel .era{color:var(--muted);margin-bottom:18px;font-size:15px}
  #panel p{line-height:1.7;font-size:15.5px;margin:0 0 12px}
  #panel h3{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--gold);margin:26px 0 10px}
  #panel ul{padding-left:18px;margin:0}
  #panel li{margin-bottom:7px;line-height:1.55;font-size:15px}
  #panel a{color:var(--gold)}
  .meta{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;margin:0;font-size:15px;line-height:1.5}
  .meta{margin-bottom:20px} .meta dt{color:var(--muted)} .meta dd{margin:0}
  .note{border-left:3px solid var(--chip-leg);padding:8px 12px;background:rgba(165,88,59,.12);font-size:14px;margin-top:14px}
  .ask{margin-top:24px;padding:14px 16px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14px;line-height:1.5}
  .ph{color:var(--muted);font-size:13px;font-style:italic}

  /* ---------- Flip book in the middle of the screen ---------- */
  #stage{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;background:rgba(8,6,4,.72);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;pointer-events:none;
    transition:opacity .3s,padding-right .35s ease}
  #stage.show{opacity:1;pointer-events:auto}                 /* dark backdrop covers the whole screen; the details bar lies on top of it */
  .fbook{position:relative;width:calc(var(--pw) * 2);height:var(--ph);perspective:2000px;
    font-size:calc(var(--pw) / 15);transition:transform .9s cubic-bezier(.4,.1,.2,1)}
  .fbook.closed{transform:translateX(calc(var(--pw) * -.5))}   /* closed: centre the cover */
  #stage.show .fbook{animation:bookIn .7s cubic-bezier(.2,.8,.3,1)}
  @keyframes bookIn{from{opacity:0;scale:.55;translate:0 60px}}
  .leaf,.base{position:absolute;top:0;left:var(--pw);width:var(--pw);height:100%}
  .leaf{transform-origin:left center;transform-style:preserve-3d;cursor:pointer;
    transition:transform 1.1s cubic-bezier(.45,.05,.25,1)}
  .leaf.flipped{transform:rotateY(-180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
  .face.back{transform:rotateY(180deg)}
  .pg{background:#f7f0de;color:#2b2118;font-family:var(--ui);padding:1.6em 1.3em;text-align:center}
  .pg.r{border-radius:0 6px 6px 0;box-shadow:inset 14px 0 18px -12px rgba(0,0,0,.45)}
  .pg.l{border-radius:6px 0 0 6px;box-shadow:inset -14px 0 18px -12px rgba(0,0,0,.45)}
  .base{background:#f7f0de;border-radius:0 6px 6px 0;
    box-shadow:2px 2px 0 #e6dbc2,4px 4px 0 #d9ccb0,6px 6px 0 #cbbd9f,10px 14px 30px rgba(0,0,0,.6)}
  .cover{background-size:100% 100%;border-radius:2px 6px 6px 2px;
    box-shadow:inset 6px 0 10px rgba(0,0,0,.45),inset -1px 0 0 rgba(255,255,255,.2)}
  .fbook.closed .leaf:first-child .cover{box-shadow:inset 6px 0 10px rgba(0,0,0,.45),10px 14px 30px rgba(0,0,0,.6)}
  /* real cover photo: fills the cover, with the spine shade drawn over it */
  .cover.photo{background:#1a1410}
  .cover.photo img{display:block;width:100%;height:100%;object-fit:cover}
  .cover.photo::after{content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 6px 0 10px rgba(0,0,0,.45),inset -1px 0 0 rgba(255,255,255,.2)}
  .seal{border:2px solid #b0362a;color:#b0362a;padding:.7em .5em;font:1.05em/1.3 "KaiTi","STKaiti","Kaiti SC",serif;display:inline-block;
    writing-mode:vertical-rl;letter-spacing:.25em;transform:rotate(-4deg);margin-top:35%}
  .pg .pl{font-size:.7em;color:#8b7355;letter-spacing:.2em}
  .pg .pt{font:bold 1.5em/1.4 var(--display);margin:1.5em 0 .8em;color:#5e1610}
  .pg .pt.long{font-size:1.2em;margin-top:1.2em}                    /* long titles, mostly English */
  .pg .pt:has(+ .ps){margin-bottom:.3em} .pg .ps{font-size:.8em;color:#8b7355;line-height:1.45;margin-bottom:.9em}
  .pg .pa{font-size:.95em;margin-bottom:.3em}
  .pg .py{font-size:.85em;color:#8b7355}
  .pg .pp{position:absolute;bottom:1.4em;left:0;right:0;font-size:.7em;color:#8b7355;padding:0 1em}
  .pg h4{margin:0 0 .9em;font-size:1em;color:#5e1610;letter-spacing:.15em;border-bottom:1px solid #d9b25f;padding-bottom:.5em}
  .pg .txt{text-align:justify;font-size:.88em;line-height:1.85}
  .pg dl{text-align:left;font-size:.82em;line-height:1.5;margin:0}
  .pg dt{color:#8b7355;font-size:.85em;margin-top:.7em} .pg dd{margin:0}
  .pg .txt.sm,.pg dl.sm{font-size:.74em;line-height:1.7}
  .pg .txt.xs,.pg dl.xs{font-size:.64em;line-height:1.55}           /* English runs longer than Chinese */
  .pg dl.hist{display:grid;grid-template-columns:auto 1fr;gap:.35em .7em;line-height:1.45}
  .pg dl.hist dt{margin:0;font-weight:bold;color:#8e2418;font-size:1em}
  .pg .num{position:absolute;bottom:.8em;left:0;right:0;font-size:.65em;color:#a8957a}
  .pg .ph{color:#8b7355}
  /* page controls under the book: one grouped bar */
  .bk-ctrl{display:flex;gap:4px;align-items:center;padding:5px;border-radius:999px;border:1px solid var(--line);background:var(--glass-strong);
    box-shadow:var(--shadow);font-size:14px;color:var(--muted)}
  .bk-ctrl button{height:40px;min-width:40px;border:0;background:none;color:var(--ink);border-radius:999px;padding:0 16px;font-size:14px;
    cursor:pointer;display:grid;place-items:center;transition:background-color .16s}
  .bk-ctrl button:hover:not(:disabled){background:var(--hover)}
  .bk-ctrl button:disabled{opacity:.3;cursor:default}
  #pgPrev,#pgNext,#bkClose{padding:0;color:var(--gold)} #bkClose{font-size:22px;color:var(--muted)}
  #pgInfo{min-width:110px;text-align:center;font-size:13.5px}

  /* ---------- Clickable author name ---------- */
  .au{color:inherit;text-decoration:underline dotted;text-underline-offset:4px;cursor:pointer}
  .pg .au:hover{color:#b0362a} #panel .au:hover,#author .au:hover{color:var(--gold)}

  /* ---------- Pop-up boxes: author, welcome guide, catalogue ---------- */
  #author,.overlay{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(8,6,4,.66);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:16px}
  #author.show,.overlay.show{display:flex}
  #authorBox,.box{position:relative;width:min(720px,100%);max-height:88vh;overflow-y:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:20px;padding:32px 30px 28px;box-shadow:0 30px 90px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06)}
  #authorBox{width:min(460px,100%)}
  #author.show #authorBox,.overlay.show .box{animation:boxIn .28s var(--ease)}
  @keyframes boxIn{from{opacity:0;transform:translateY(10px) scale(.985)}}
  #authorBox h2,.box h2{margin:0 0 8px;font:600 28px/1.25 var(--display);color:var(--ink)}
  #authorBox h2{margin-top:14px}
  #authorBox h3{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--gold);margin:22px 0 10px}
  #authorBox p{line-height:1.7;font-size:15px;margin:0 0 10px}
  #authorBox ul{list-style:none;padding:0;margin:0} #authorBox li{margin-bottom:8px;line-height:1.5;font-size:14.5px}
  .box .lead{color:var(--muted);font-size:15px;margin:0 0 20px;line-height:1.6;max-width:60ch}
  .btn{height:46px;padding:0 24px;border-radius:999px;border:1px solid var(--gold);background:var(--gold);color:var(--on-gold);
    font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background-color .16s,transform .16s var(--ease)}
  .btn:hover{background:var(--gold-strong)} .btn:active{transform:scale(.97)}
  .btn.ghost{background:none;color:var(--ink);font-weight:500;border-color:var(--line-strong)} .btn.ghost:hover{background:var(--hover)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .steps{list-style:none;margin:0 0 24px;padding:0;counter-reset:s;display:grid;gap:14px}
  .steps li{counter-increment:s;position:relative;padding:4px 0 0 48px;font-size:15.5px;line-height:1.6;min-height:34px}
  .steps li::before{content:counter(s);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;
    background:var(--hover);color:var(--gold-strong);display:grid;place-items:center;font:600 16px var(--display)}
  .steps b{color:var(--gold-strong);font-weight:600}
  /* catalogue */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chips button{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:none;font-size:13.5px;cursor:pointer;
    transition:background-color .16s,border-color .16s}
  .chips button:hover{background:var(--hover)}
  .chips button.on{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
  #catBody h3{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--gold);margin:22px 0 8px}
  #catBody ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 12px}
  #catBody li{display:flex;gap:10px;align-items:baseline;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:15px;line-height:1.35;
    transition:background-color .12s}
  #catBody li:hover{background:var(--hover)}
  #catBody li i{flex:none;width:8px;height:8px;border-radius:50%}
  #catBody li small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  /* ---------- Smaller screens ---------- */
  @media (max-width:1180px){ #search{top:74px} #toast{top:130px} }          /* search gets its own row */
  @media (max-width:760px){
    .hud-title small{display:none} #search kbd,#viewBtn::after{display:none}
    /* two rows: brand on the left and tools on the right, search bar centred underneath */
    #tools{right:16px} .hud-title{left:16px} #search{top:80px} #toast{top:136px}
    .tool{height:44px} #helpBtn{width:44px} #closeBtn,.x,#authorClose{width:44px;height:44px;top:8px;right:8px} .chips button{height:40px}   /* finger-sized targets */
    #viewBtn{bottom:158px;max-width:calc(100vw - 32px)}
    #map{--mh:128px} #map.big{--mh:min(360px, calc(100vh - 110px))}
    .arrow{width:54px;height:54px}
    #authorBox,.box{padding:26px 20px 22px} }
  /* phones: the brand shrinks to its seal and the tools tighten, so both still share the top row */
  @media (max-width:560px){ .hud-title{padding:0 4px} .hud-title > div{display:none} }
  @media (max-width:400px){ .tool{padding:0 10px;font-size:13px} }
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important} }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud-title"><span class="seal-mark" aria-hidden="true">馆</span><div><b>Cultural Explorer</b><small id="sub"></small></div></div>
<div id="tools">
  <button class="tool" id="catBtn"></button>
  <button class="tool" id="langBtn" aria-label="Switch language"></button>
  <button class="tool" id="helpBtn">?</button>
</div>
<div id="search" role="search">
  <input id="q" type="text" autocomplete="off" spellcheck="false" aria-label="Search books"><kbd>/</kbd>
  <ul id="results"></ul>
</div>
<canvas id="map" width="384" height="680"></canvas>
<div id="mapTip"></div>
<div class="controls">
  <button class="arrow" id="fwd" aria-label="Walk forward"><i class="chev up"></i></button>
  <button class="arrow" id="left" aria-label="Turn left"><i class="chev left"></i></button>
  <button class="arrow" id="back" aria-label="Walk back"><i class="chev down"></i></button>
  <button class="arrow" id="right" aria-label="Turn right"><i class="chev right"></i></button>
</div>
<button id="viewBtn"></button>
<div id="toast"></div>

// Split text into lines that fit maxW (character by character, works for Chinese)
function wrapText(g, text, maxW){
  const lines = []; let line = '';
  for (const ch of text) {
    if (g.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; } else line += ch;
  }
  if (line) lines.push(line); return lines;
}
// The same for English: break between words
function wrapWords(g, text, maxW){
  const lines = []; let line = '';
  for (const word of text.split(' ')) {
    const next = line ? line + ' ' + word : word;
    if (g.measureText(next).width > maxW && line) { lines.push(line); line = word; } else line = next;
  }
  if (line) lines.push(line); return lines;
}

// a title or name as a list of syllables; each syllable is the list of its possible readings
const syllables = s => [...norm(s)].map(ch => PINYIN[ch] || (/[a-z0-9]/.test(ch) ? [ch] : null)).filter(Boolean);
const PY_TEXTS = ITEMS.map(it => [it.title, ...it.author.split('、')].map(syllables));
// the letters typed must start at the beginning of a character and follow the characters in order; the last one may be unfinished
function pinyinFrom(syl, p, q){
  if (!q) return true;
  if (p >= syl.length) return false;
  return syl[p].some(r => r.startsWith(q) || (q.startsWith(r) && pinyinFrom(syl, p + 1, q.slice(r.length))));
}
const pinyinMatch = (i, q) => PY_TEXTS[i].some(syl => syl.some((_, p) => pinyinFrom(syl, p, q)));
function runSearch(){
  const q = norm(qInput.value.trim()), key = strip(q);
  results = [];
  if (q) {
    const hay = /^[a-z0-9]$/.test(key) ? HAY_NAME : key ? HAY_KEY : HAY;
    ITEMS.forEach((it, i) => { if (hay[i].includes(key || q)) results.push(i); });
    // then books whose title or author reads like the letters typed (two letters or more)
    const py = key.replace(/ü/g, 'v');
    if (/^[a-z]{2,}$/.test(py)) ITEMS.forEach((it, i) => { if (!results.includes(i) && pinyinMatch(i, py)) results.push(i); });
    // -1: the Centre's own introduction (end signboard); one Latin letter alone is too vague to match it
    if (key && (key.length > 1 || /[^\x00-\x7f]/.test(key)) && CENTRE_KEYS.some(w => w.includes(key))) results.push(-1);
  }
  resultOn = 0;
  resultsEl.innerHTML = !q ? '' : !results.length ? `<li class="none">${L('none')}</li>` :
    results.map((i, k) => i < 0
      ? `<li data-k="${k}"><i style="background:#d9b25f"></i><span>${L('centreName')}<small>${L('centreWhere')}</small></span></li>`
      : `<li data-k="${k}"><i style="background:${TYPES[ITEMS[i].type].color}"></i><span>${esc(bookName(ITEMS[i]))}<small>${esc(authorsOf(ITEMS[i]))} · ${yearOf(ITEMS[i])} · ${esc(genreOf(ITEMS[i]))}</small></span></li>`).join('');
  resultsEl.classList.toggle('show', !!q);
  markResult();
}
function markResult(){
  [...resultsEl.children].forEach((li, k) => li.classList.toggle('on', results.length > 0 && k === resultOn));
  const li = resultsEl.children[resultOn]; if (li && results.length) li.scrollIntoView({block:'nearest'});
}
function pickResult(k){
  if (!results.length) return;
  const i = results[k];
  resultsEl.classList.remove('show'); qInput.blur();
  if (i < 0) travelToSign(); else travelTo(i);              // glide there; it opens on arrival
}
qInput.addEventListener('input', runSearch);
qInput.addEventListener('focus', () => {                  // old search text is selected, so typing replaces it
  setTimeout(() => qInput.select(), 0); if (qInput.value.trim()) runSearch();
});
qInput.addEventListener('blur', () => resultsEl.classList.remove('show'));
qInput.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (results.length) { resultOn = (resultOn + (e.key === 'ArrowDown' ? 1 : -1) + results.length) % results.length; markResult(); }
    e.preventDefault();
  } else if (e.key === 'Enter') { if (!e.isComposing) pickResult(resultOn); }
  else if (e.key === 'Escape') { qInput.value = ''; runSearch(); qInput.blur(); }
});
resultsEl.addEventListener('pointerdown', e => e.preventDefault());      // keep the input focused while choosing
resultsEl.addEventListener('click', e => { const li = e.target.closest('li[data-k]'); if (li) pickResult(+li.dataset.k); });

}

const stage = document.getElementById('stage'), fbook = document.getElementById('fbook');

let bookRatio = 1.25;   // page height ÷ width; a book opened with its cover photo takes the photo's shape

function sizeBook(){
  // the book sits in the middle of the whole screen
  let pw = Math.max(130, Math.min(300, (innerWidth - 40) / 2, (innerHeight - 150) / bookRatio)), pad = 0;
  // only when the details bar is open and the screen is too narrow for both, the book moves aside just enough
  if (innerWidth >= 900 && panel.classList.contains('open')) {
    const free = innerWidth - panel.offsetWidth;             // room left of the details bar
    pw = Math.max(130, Math.min(pw, (free - 40) / 2));
    const over = innerWidth / 2 + pw + 20 - free;            // how far a centred open book would run under the bar
    if (over > 0) pad = over * 2;
  }
  stage.style.paddingRight = pad + 'px';
  fbook.style.setProperty('--pw', pw + 'px'); fbook.style.setProperty('--ph', pw * bookRatio + 'px');
}

// Real cover photos come from covers.js, a separate file so that this page stays small. It is loaded once the scene is up.
// Each photo is painted over the drawn cover of its book on the wall, and shown when the book is opened.
// Without covers.js, or for a book that has no photo in it, the drawn cover stays.
// (The photos sit inside covers.js, not in picture files, so that the page also works when opened by double-click:
// a browser does not let a 3D scene use picture files from the disk or from another website.)
// covers.js holds the Centre's photos of the Chinese editions (window.COVERS, keyed by `cover`);
// covers-en.js holds the covers of the English editions (window.COVERS_EN, keyed by `en.cover`).
const coverPhoto = (it, img) => `<img src="${img.src}" alt="${esc(titleOf(it))}" draggable="false">`;
const coverRatio = img => Math.min(1.65, Math.max(1.2, img.naturalHeight / img.naturalWidth));   // book takes the photo's shape (the 28 photos run from 1.29 to 1.63)
// The real cover to show now. English: the English edition's cover. Chinese: the Chinese edition's photo, or, for a
// translated work that has none here, the cover of its English edition (a real cover rather than a drawn one).
const coverOf = it => isEn(it) ? it.en.coverImg : (it.coverImg || (it.en && it.en.coverImg));
const coverCreditOf = it => coverOf(it) === it.coverImg ? L('coverCredit') : L('coverCreditEn');
function loadCover(i, src, holder){                          // holder: the book (Chinese edition) or its `en` part
  if (!src || holder.coverAsked) return;
  holder.coverAsked = true;
  const img = new Image();
  img.onload = () => {
    holder.coverImg = img;
    // wall: paint the photo over the whole drawn cover, shade the spine, and make the book as wide as the photo needs
    paintExhibit(i);
    if (current !== i || coverOf(ITEMS[i]) !== img) return;
    // this book is already open with another cover: swap the photo in where it is
    const face = fbook.querySelector('.cover');
    if (face) { face.classList.add('photo'); face.style.backgroundImage = ''; face.innerHTML = coverPhoto(ITEMS[i], img); }
    bookRatio = coverRatio(img); sizeBook();
    const credit = document.getElementById('coverCredit');
    if (credit) { credit.hidden = false; credit.textContent = ' · ' + coverCreditOf(ITEMS[i]); }
  };
  img.src = src;
}
function applyCovers(){
  const zh = window.COVERS || {}, en = window.COVERS_EN || {};
  ITEMS.forEach((it, i) => { loadCover(i, zh[it.cover], it); if (it.en) loadCover(i, en[it.en.cover], it.en); });
}
['covers.js', 'covers-en.js'].forEach(f => { const s = document.createElement('script'); s.src = f; s.onload = applyCovers; document.head.appendChild(s); });

function showBook(pages, sourceNote, names, ratio = 1.25){

// stacking: unturned pages - first on top; turned pages - last turned on top
function layoutLeaves(active = -1){
  pageLeaves.forEach((lf, k) => {
    lf.classList.toggle('flipped', k < flipped);
    lf.style.zIndex = k === active ? 50 : k < flipped ? 10 + k : 10 + pageLeaves.length - k;
  });
  fbook.classList.toggle('closed', flipped === 0);
  pgPrev.disabled = flipped === 0; pgNext.disabled = flipped === pageLeaves.length;
  pgInfo.textContent = PAGE_NAMES[flipped];
}
let settleTimer;
function turn(d){
  const n = flipped + d; if (n < 0 || n > pageLeaves.length) return;
  const active = d > 0 ? flipped : n;                  // the leaf that is moving
  flipped = n; layoutLeaves(active);
  clearTimeout(settleTimer); settleTimer = setTimeout(() => layoutLeaves(), 1100);
}

const mg = map.getContext('2d');
function drawMap(){
  const W = MAP_W, H = MAP_H, pad = MAP_PAD;
  mg.setTransform(map.width / W, 0, 0, map.height / H, 0, 0);   // canvas is 4× the drawing units, so it stays sharp when enlarged
  // start (entrance) at the bottom, far end at the top
  const zToY = z => pad + (z - LEN_BACK) / (Z_START - LEN_BACK) * (H - pad*2);
  mg.clearRect(0, 0, W, H);
  mg.strokeStyle = '#d9b25f'; mg.lineWidth = 2;
  const lx = W*0.3, rx = W*0.7, fy = zToY(FZ), gap = (rx - lx) * DOOR_W / (HALF_W * 2) / 2;
  mg.beginPath(); mg.moveTo(lx, pad); mg.lineTo(lx, fy); mg.moveTo(rx, pad); mg.lineTo(rx, fy);
  mg.moveTo(lx, pad); mg.lineTo(rx, pad);                                   // end wall
  mg.moveTo(4, fy); mg.lineTo(W/2 - gap, fy); mg.moveTo(W/2 + gap, fy); mg.lineTo(W - 4, fy);  // facade + door gap
  mg.stroke();
  exhibits.forEach((ex, i) => {
    const y = zToY(ex.item.z), x = ex.item.side < 0 ? lx - 12 : rx;
    mg.fillStyle = i === mapHover ? '#fff' : i === nearest ? '#ffd27a' : 'rgba(217,178,95,.35)';
    mg.fillRect(x, y - 2, 12, 4);
  });
  const py = zToY(camera.position.z);
  const px = THREE.MathUtils.clamp(W/2 + camera.position.x / HALF_W * (rx - lx) / 2, 6, W - 6);
  mg.save(); mg.translate(px, py); mg.rotate(-yaw);   // arrow shows where you are and where you are looking
  mg.fillStyle = '#fff'; mg.beginPath();
  mg.moveTo(0, -7); mg.lineTo(-5, 5); mg.lineTo(5, 5); mg.closePath(); mg.fill(); mg.restore();
}

        `${DEVICE.gpu.replace(/angle \(|direct3d.*|\(0x.*/g, '').slice(0, 44) || 'gpu unknown'}\n` +
        `${DEVICE.touch ? 'touch' : 'mouse'} · cores ${DEVICE.cores || '?'} · mem ${DEVICE.mem || '?'} · dpr ${DEVICE.dpr} · aa ${ANTIALIAS ? 'on' : 'off'}\n` +
        `${stats.fps.toFixed(0)} fps · frame ${stats.frameMs.toFixed(1)} ms (worst ${worst.toFixed(0)})\n` +
        `${DEBUG > 1 ? 'cpu+gpu' : 'cpu'} ${stats.workMs.toFixed(2)} ms\n` +
        `calls ${stats.calls} · tris ${stats.triangles} · lights ${stats.lights}\n` +
        `geo ${stats.geometries} · tex ${stats.textures} · prog ${stats.programs}` + (this.note ? '\n' + this.note : '');
      n = 0; work = 0; worst = 0; t0 = now;
    }
  };
})();

/* ---------------- Frame pacing and the safety net ---------------- */
// Safety net: when frames stay slow, the scene is drawn with fewer pixels. The scale only ever steps down (never below 1),
// and only after two slow 2-second windows in a row, so it cannot flip back and forth.
const SLOW_MS = 20, guard = {t0:0, frames:0, slow:0, quietUntil:6000};   // slow = under 50 frames a second; the first seconds (loading) do not count
function watchFrameTime(now){
  if (!guard.t0 || now < guard.quietUntil) { guard.t0 = now; guard.frames = 0; return; }
  guard.frames++;
  if (now - guard.t0 < 2000) return;
  guard.slow = (now - guard.t0) / guard.frames > SLOW_MS ? guard.slow + 1 : 0;
  guard.t0 = now; guard.frames = 0;
  if (guard.slow < 2 || renderScale <= 1) return;
  renderScale = Math.max(1, renderScale - .25); renderer.setPixelRatio(renderScale);
  guard.slow = 0; guard.quietUntil = now + 4000;             // let the new size settle before judging again
  if (perf) perf.note = `scale lowered to ${renderScale.toFixed(2)} (frames were slow)`;
}
let vsyncMs = 1000 / 60, lastRaf = 0, frameDue = 0;          // vsyncMs: the screen's refresh interval, the shortest gap seen between callbacks

/* ---------------- Sleeping while the scene cannot be seen ---------------- */
// An open book, the Centre's introduction, the author box, the guide, the catalogue and the quiz each cover the whole scene
// (it only shows dimmed and blurred behind them), so drawing it again and again shows nothing new. The loop stops, and starts
// again when the box closes or the tab comes back. Whatever changes the picture meanwhile asks for one frame with wake().
const covering = [stage, authorEl, ...overlays];
const sceneCovered = () => covering.some(el => el.classList.contains('show'));
let rafId = 0, oneMore = true;                               // oneMore: draw one frame although the scene is covered
function wake(){ oneMore = true; if (!rafId) rafId = requestAnimationFrame(tick); }
{
  const watcher = new MutationObserver(wake);                // a box opened, closed, or was shown again (the camera may have jumped behind it)
  covering.forEach(el => watcher.observe(el, {attributes:true, attributeFilter:['class']}));
}
document.addEventListener('visibilitychange', wake);
addEventListener('resize', wake);                            // a resized canvas is blank until it is drawn again

/* ---------------- Loop ---------------- */
const clock = new THREE.Clock();
let simTime = 0;                                             // scene time: stands still while the loop sleeps, so motion carries on where it stopped
const lampsFor = new THREE.Vector3(1e9, 0, 0);               // where you stood when the lights were last handed out
const mapSeen = {x:1e9, z:0, yaw:0, nearest:-2, hover:-2};   // what the minimap last showed
let viewText = '', cursorNow = '';
function showView(text){ if (text !== viewText) viewBtn.textContent = viewText = text; viewBtn.classList.add('show'); }   // the page is only touched when the label changes
function tick(now){
  rafId = 0;
  if (document.hidden) return;                               // tab in the background: visibilitychange wakes the loop
  const covered = sceneCovered();
  if (covered && !oneMore) return;
  if (covered) lastRaf = 0;
  else {
    rafId = requestAnimationFrame(tick);
    if (lastRaf && now - lastRaf > 4) vsyncMs = Math.min(vsyncMs, now - lastRaf);
    lastRaf = now;
    if (QUALITY.fpsCap && vsyncMs < 11.8) {                  // low tier on a 90 / 120 Hz screen: draw about 60 times a second (less heat, longer battery)
      if (now < frameDue - 2) return;
      frameDue = Math.max(frameDue + 1000 / QUALITY.fpsCap, now);
    }
  }
  oneMore = false;
  const frameStart = performance.now();
  const dt = Math.min(clock.getDelta(), .05), time = simTime += dt;
  dir = btnDir || ((keys.ArrowUp || keys.KeyW) ? -1 : (keys.ArrowDown || keys.KeyS) ? 1 : 0);
  const kTurn = turnDir || ((keys.ArrowLeft || keys.KeyA) ? 1 : (keys.ArrowRight || keys.KeyD) ? -1 : 0);
  if (dir || kTurn) cancelTravel();                         // any manual control stops the glide
  if (dir && !panelOpen) {
    focus = -1;
    const step = -dir * SPEED * dt;                         // + = forward, along the direction you are looking
    move(-Math.sin(yaw) * step, -Math.cos(yaw) * step);
    camera.position.y = EYE + Math.sin(time * 9) * 0.025;   // subtle head bob
  }
  // glide to a clicked book: ease in/out, at most 5 m/s, no head bob, then open its details
  const gliding = (travel >= 0 || travelSign) && !panelOpen;
  if (gliding) {
    const dz = (travelSign ? Z_END : ITEMS[travel].z) - camera.position.z, far = Math.abs(dz) > 1.5;
    camera.position.x += -camera.position.x * Math.min(1, dt * 4);   // back to the middle of the corridor
    move(0, Math.sign(dz) * Math.min(Math.abs(dz), Math.min(5, Math.abs(dz) * 2.5 + .6) * dt));   // waits at the facade until lined up with the door
    camera.position.y = EYE;
    if (travel >= 0)   // long trip: face the way you walk, turn to the wall only when you are nearly there
      yawTarget = nearYaw(travelFar && far ? (dz < 0 ? 0 : Math.PI) : -ITEMS[travel].side * Math.PI / 2);
    if (Math.abs(dz) < .03 && Math.abs(camera.position.x) < .05 && Math.abs(yawTarget - yaw) < .05) {
      if (travelSign) { travelSign = false; openCentre(); }
      else { focus = travel; travel = -1; openPanel(focus); }
    }
  }
  // manual look: arrow keys / A D / on-screen buttons / mouse drag
  if (kTurn && !panelOpen)
    yawTarget = THREE.MathUtils.clamp(yawTarget + kTurn * TURN_SPEED * dt, -YAW_LIMIT, YAW_LIMIT);
  yaw += (yawTarget - yaw) * Math.min(1, dt * (gliding ? 5 : 12));   // slower, gentler turns while gliding
  camera.rotation.set(-0.005, yaw, 0);

  // doors open automatically when you walk up to them, close when you walk away outside
  const wantOpen = camera.position.z < FZ + 4 ? 1 : 0;
  doorOpen += (wantOpen - doorOpen) * Math.min(1, dt * 2.5);
  leaves.forEach(({pivot, s}) => { pivot.rotation.y = -s * doorOpen * 1.75; });

  // which book does the View button offer?
  let best = -1;
  if (hoverMode) {
    // mouse: the book under the cursor, when it is one of the nearest few in front or behind (NEAR_N each way)
    let over = -1, onSign = false;
    if (ptrOn && !panelOpen) {
      ray.setFromCamera(mouse, camera);
      const hit = ray.intersectObjects(pickables)[0];
      if (hit) { onSign = hit.object === endSign; if (!onSign) over = bookOf(hit); }
    }
    if (over >= 0 && nearSet().includes(over)) best = over;
    const cursor = over >= 0 || onSign ? 'pointer' : '';         // every book and the signboard can be clicked
    if (cursor !== cursorNow) canvas.style.cursor = cursorNow = cursor;
  } else {
    // touch: the book closest to ~1.5 m ahead of you, from either side
    let bestD = Infinity;
    exhibits.forEach((ex, i) => {
      if (!inRange(ex.item)) return;
      const d = Math.abs((camera.position.z - ex.item.z) - 1.5);
      if (d < bestD) { bestD = d; best = i; }
    });
    // ... but a book you are looking straight at (within about 30 degrees, up to 4 m away) wins
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw); let lookCos = .85;
    exhibits.forEach((ex, i) => {
      const dx = ex.item.side * HALF_W - camera.position.x, dz = ex.item.z - camera.position.z, d = Math.hypot(dx, dz);
      if (d > 4) return;
      const cos = (dx * fx + dz * fz) / d;
      if (cos > lookCos) { lookCos = cos; best = i; }
    });
    if (focus >= 0) best = focus;                               // the book you walked to stays highlighted
  }
  nearest = travel >= 0 ? travel : best;                        // a book you are walking to is always shown
  // the halo and marker sit at the active book; when another book becomes active they jump there and fade in again
  if (nearest >= 0 && nearest !== spotAt) {
    if (spotAt >= 0) exhibits[spotAt].coverMat.emissiveIntensity = .3;
    spotAt = nearest;
    activeSpot.position.set(ITEMS[spotAt].side * HALF_W, 0, ITEMS[spotAt].z); activeSpot.rotation.y = -ITEMS[spotAt].side * Math.PI / 2;
    halo.material.opacity = marker.material.opacity = 0;
  }
  const on = nearest >= 0, pulse = .5 + .5 * Math.sin(time * 4), ease = 1 - Math.exp(-dt * 9.75);   // same pace as 15% a frame at 60 fps, on any screen
  halo.material.opacity += ((on ? .35 + .25 * pulse : 0) - halo.material.opacity) * ease;
  marker.material.opacity += ((on ? 1 : 0) - marker.material.opacity) * ease;
  halo.visible = marker.visible = on || marker.material.opacity > .01;      // not drawn at all once faded out
  marker.rotation.y = time * 2; marker.position.y = 2.32 + Math.sin(time * 3) * .05;
  if (spotAt >= 0) exhibits[spotAt].coverMat.emissiveIntensity = on ? .45 + .1 * pulse : .3;
  // the signboard becomes active in the empty stretch after the last book
  signActive = nearest < 0 && camera.position.z < Z_END + .8;
  endSignFace.emissiveIntensity = signActive ? .45 + .15 * Math.sin(time * 4) : .25;
  if (nearest >= 0) {
    const it = ITEMS[nearest];
    highlight.position.set(it.side * (HALF_W - .8), 2.6, it.z); highlight.intensity = .9;
    showView(L('view') + bookName(it));
  } else if (signActive) {
    showView(L('view') + L('centreName')); highlight.intensity = 0;
  } else { viewBtn.classList.remove('show'); highlight.intensity = 0; }

  const p = camera.position;
  if (p.distanceToSquared(lampsFor) > 1e-4) { lampsFor.copy(p); assignLamps(); }   // you moved: hand the lights out again
  hideFarDetail(now);
  animateScene(time);
  // the minimap is redrawn only when something on it changed: where you stand, where you look, the active book, the book under the cursor
  if (Math.abs(p.x - mapSeen.x) > .02 || Math.abs(p.z - mapSeen.z) > .02 || Math.abs(yaw - mapSeen.yaw) > .01
      || nearest !== mapSeen.nearest || mapHover !== mapSeen.hover) {
    mapSeen.x = p.x; mapSeen.z = p.z; mapSeen.yaw = yaw; mapSeen.nearest = nearest; mapSeen.hover = mapHover;
    drawMap();
  }
  renderer.render(scene, camera);
  if (perf) perf.frame(frameStart);
  if (covered) { guard.t0 = 0; if (perf) perf.sleeping(); }   // that was the one frame: asleep until wake()
  else watchFrameTime(now);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
